name: Build and release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Store Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: dday-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DDay.apk
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 DDay.apk --clobber
          else
            gh release create v1.0.0 DDay.apk --title "나예 D-day 1.0.0" --notes "삼성 LockStar에서 잠금화면 아래에 추가할 수 있는 초소형 D-day 위젯."
          fi
